{% if site.google_analytics_ga4 %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_ga4 }}"></script>
<script>
  (function () {
    var isAutomated = typeof navigator !== "undefined" && navigator.webdriver === true;
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      if (isAutomated) return;
      window.dataLayer.push(arguments);
    }
    window.gtag = gtag;
    window.jgTrack = function (eventName, params) {
      if (isAutomated || !eventName) return;
      try {
        var payload = Object.assign({ transport_type: "beacon" }, params || {});
        gtag("event", eventName, payload);
      } catch (e) {}
    };
    if (isAutomated) return;

    var rawPath = (window.location.pathname || "/").replace(/\/{2,}/g, "/");
    var cleanPath = rawPath;
    var cleanLocation = window.location.href;
    var is404Page = {{ page.url == "/404.html" | jsonify }};

    if (!is404Page) {
      try {
        var canonEl = document.querySelector('link[rel="canonical"]');
        if (canonEl && canonEl.href) {
          var parsedCanon = new URL(canonEl.href);
          cleanPath = parsedCanon.pathname || cleanPath;
          cleanLocation = parsedCanon.origin + cleanPath + (window.location.search || "");
        }
      } catch (e) {}
    }

    gtag("js", new Date());
    gtag("config", "{{ site.google_analytics_ga4 }}", {
      anonymize_ip: true,
      page_path: cleanPath,
      page_location: cleanLocation
    });

    try {
      var ref = (document.referrer || "").toLowerCase();
      var utm = (new URLSearchParams(window.location.search).get("utm_source") || "").toLowerCase();
      var src = "";
      if (utm.indexOf("chatgpt") !== -1 || ref.indexOf("chatgpt.com") !== -1 || ref.indexOf("chat.openai.com") !== -1) src = "chatgpt";
      else if (utm.indexOf("perplexity") !== -1 || ref.indexOf("perplexity.ai") !== -1) src = "perplexity";
      else if (utm.indexOf("claude") !== -1 || ref.indexOf("claude.ai") !== -1) src = "claude";
      else if (utm.indexOf("notebooklm") !== -1 || ref.indexOf("notebooklm.google.com") !== -1) src = "notebooklm";
      else if (utm.indexOf("gemini") !== -1 || ref.indexOf("gemini.google.com") !== -1) src = "gemini";
      else if (ref.indexOf("copilot.microsoft.com") !== -1) src = "copilot";
      else if (ref.indexOf("grok.com") !== -1 || ref.indexOf("x.ai") !== -1) src = "grok";
      else if (ref.indexOf("mistral.ai") !== -1) src = "mistral";
      else if (ref.indexOf("deepseek.com") !== -1) src = "deepseek";
      else if (ref.indexOf("phind.com") !== -1) src = "phind";
      else if (ref.indexOf("you.com") !== -1) src = "you";
      else if (ref.indexOf("meta.ai") !== -1) src = "meta_ai";
      if (src) {
        window.jgTrack("ai_citation_visit", { ai_engine: src, landing_path: cleanPath });
      }
    } catch (e) {}
  })();
</script>
{% endif %}
