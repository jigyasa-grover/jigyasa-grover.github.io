career:
  - role: "Machine Learning Engineer (Tech Lead, Product Selector Ranking & Engineering Lead, Org-Wide AI Initiative)"
    org: "Uber"
    period: "Apr 2025 – Present"
    location: "San Francisco, CA"
    summary: "End-to-end technical lead (directing 3 ML Engineers and 1 Data Engineer) for global Product Selector Ranking serving ~750M to 950M daily requests across 500+ cities, plus org-wide agentic ML tooling."
    highlights:
      - "Architected a shared-bottom DCNv2 Mixture-of-Experts (MoE) and parallel product tower ranking architecture, achieving 2× GPU utilization (44% → 98%) and cutting 8× NVIDIA A100 training time from 42.4h to 15.6h alongside multi-GPU B200 scaling."
      - "Co-designed a Pareto-optimal (MGDA + Frank-Wolfe) T5 (Text-to-Text Transfer Transformer) sequential cross-vertical user representation foundation model across Rides and Eats."
      - "Built three 0→1 internal agentic developer systems: an AI-Assisted On-Call Triage & Causal Alert-Clustering Platform, an LLM-Powered Ranking Explainer Agent with automated reward-signal graders, and a Dynamic Experiment Config Automator."
  - role: "Principal AI Strategist, Educator & Advisor"
    org: "Afterdays"
    period: "2015 – Present"
    location: "San Francisco Bay Area"
    summary: "11-year independent AI advisory, corporate education, developer content, and global keynote practice partnering with 30+ enterprises, AI startups, and venture funds."
    highlights:
      - "Advised and consulted across Google, Meta, Apple, Microsoft, Anthropic, Amazon Fresh, Spotify, Adobe, Grammarly, Figma, Atlassian, Coinbase, Remitly, Superhuman, Windsurf, Base44, HP, Southwest Airlines, Neutrogena, Eero, Innodata, Diem AI, Bezoku AI, Okareo, Optica Labs AI, BackOps AI, Founders Circle Capital, Capital Hill Ventures, Preston-Werner Ventures, and Fusion Hill."
      - "Delivered hands-on AI architecture and agentic engineering programs reaching 50,000+ engineers and leaders across LinkedIn Learning, Morgan Stanley, FedEx, Accenture, Roblox, Silicon Valley Security Group, AI Aspire, CommonSpirit Health, Interview Kickstart, and 200+ stages in 21 countries."
  - role: "Lead Engineer, AI & Research"
    org: "Bordo AI"
    period: "Jan 2024 – Mar 2025"
    location: "San Francisco Bay Area"
    summary: "Architected a 0→1 provider-agnostic enterprise conversational AI and agentic data analytics platform."
    highlights:
      - "Designed multi-LLM orchestration across Claude, Gemini, and GPT using LangGraph, embedding + RL dynamic tool selection across hundreds of analytics schemas, and hybrid vector + Redis state stores deployed across 25+ organizations."
      - "Engineered deterministic SQL ground-truth reward graders, automated evaluation harnesses, latency budgets, and hallucination guardrails for enterprise business intelligence workflows."
  - role: "Senior Data Scientist — Feature Store & Ads Bidding (0→1)"
    org: "Faire"
    period: "May 2023 – Jan 2024"
    location: "San Francisco, CA"
    summary: "Built foundational marketplace ads prediction, feature infrastructure, and bidding calibration."
    highlights:
      - "Engineered real-time impression-level feature store pipelines and a calibrated XGBoost bidding engine with Bayesian cold-start smoothing (+20% ROC-AUC, +40% PR-AUC), alongside a marketplace monetization simulator."
  - role: "Senior Machine Learning Engineer — Ads Ranking, Feature & Serving Infrastructure"
    org: "Twitter (X)"
    period: "Jan 2019 – Apr 2023"
    location: "San Francisco, CA"
    summary: "Owned billion-request/day ads click and conversion ranking models and real-time feature serving across Home Timeline, Replies, Profile, and Search under strict sub-50ms SLAs."
    highlights:
      - "Led dynamic feature hydration infrastructure, TwHIN graph embedding integration, and post-ATT SKAdNetwork privacy-preserving serving architectures achieving a 70% infrastructure cost reduction."
      - "Founded the Women@ML Business Resource Group, mentored EarlyBird & TakeFlight cohorts, and led cross-team ML engineering onboarding across ads ranking and Cortex."
  - role: "Software Engineer — Ads Signal Monitoring"
    org: "Meta (Facebook)"
    period: "2018"
    location: "Menlo Park, CA"
    summary: "Built real-time statistical anomaly detection systems on live Facebook Pixel conversion streams."
    highlights:
      - "Automated high-throughput signal integrity alerting across advertiser conversion pipelines."
  - role: "Early Research & Open Source Engineering"
    org: "San Diego Supercomputer Center · Cornell/Maryland/Max Planck (CMMRS) · IRD Paris · NRC Canada · GSoC"
    period: "2015 – 2018"
    location: "San Diego · Saarbrücken · Paris · Ottawa"
    summary: "Cross-disciplinary research in computer vision, agent-based ecological modeling, and computational social networks, paired with Graduate Teaching Assistantships at UC San Diego (CSE 110 Software Engineering & COGS 102 Cognitive Design)."
    highlights:
      - "Selected on full scholarship among Top 30 globally for the Cornell, Maryland, Max Planck Pre-doctoral Research School (CMMRS) at MPI-SWS in Saarbrücken, Germany."
      - "Automated histology brain-atlas image annotation and IIIF server pipelines (loris-imageserver/loris) at SDSC; CORMAS spatial agent-based modeling in Pharo Smalltalk at IRD France (ESUG Scholar, ACM IWST 2017); kinetic Monte Carlo social simulation on Hashkat at NRC Canada (Government of Canada Mitacs Globalink Research Scholar)."
      - "Two-time Google Summer of Code developer (FOSSASIA Loklak & Pharo Consortium) and GSoC Organization Administrator; awarded 13+ competitive grants by the Governments of Canada, Norway, France, and India (MHRD), The Linux Foundation, ESUG, PSF, ACM womENcourage, SWE, CRA-W, AnitaB.org, and Meta."

