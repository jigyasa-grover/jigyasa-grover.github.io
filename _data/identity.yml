career:
  - role: "Machine Learning Engineer (Tech Lead — Rider Personalization & Ranking)"
    org: "Uber"
    period: "Apr 2025 – Present"
    location: "San Francisco, CA"
    summary: "End-to-end technical lead for global rider personalization and ranking pipelines serving millions of daily riders across 500+ cities."
    highlights:
      - "Architected multi-task Mixture-of-Experts (MoE) ranking, calibration, and cross-vertical user representation foundation models trained on distributed NVIDIA A100/B200 GPU clusters."
      - "Built 0→1 internal agentic developer tooling—including a Ranking Explainer Agent with automated reward-signal graders and an Experiment Config Automator—accelerating ML experimentation velocity."
  - role: "Lead Engineer, AI & Research"
    org: "Bordo AI"
    period: "Jan 2024 – Mar 2025"
    location: "San Francisco Bay Area"
    summary: "Architected a 0→1 provider-agnostic enterprise conversational AI and agentic data analytics platform."
    highlights:
      - "Designed multi-LLM orchestration across Claude, Gemini, and GPT using LangGraph, custom RAG pipelines, and hybrid vector + Redis state stores deployed across 25+ organizations."
      - "Established evaluation harnesses, latency budgets, and hallucination guardrails for enterprise business intelligence workflows."
  - role: "Senior Data Scientist — Feature Store & Ads Bidding (0→1)"
    org: "Faire"
    period: "May 2023 – Jan 2024"
    location: "San Francisco, CA"
    summary: "Built foundational marketplace ads prediction, feature infrastructure, and bidding calibration."
    highlights:
      - "Engineered real-time impression-level feature store pipelines and a calibrated XGBoost bidding engine with Bayesian cold-start smoothing (+20% ROC-AUC, +40% PR-AUC), alongside a marketplace monetization simulator."
  - role: "Senior Machine Learning Engineer — Ads Ranking, Feature & Serving Infrastructure"
    org: "Twitter (X)"
    period: "Jan 2019 – Apr 2023"
    location: "San Francisco, CA"
    summary: "Owned billion-request/day ads click and conversion ranking models and real-time feature serving under strict sub-50ms SLAs."
    highlights:
      - "Led dynamic feature hydration infrastructure, TwHIN graph embedding integration, and post-ATT privacy-preserving serving architectures achieving a 70% infrastructure cost reduction."
      - "Founded the Women@ML Business Resource Group and mentored engineers across ads ranking and cortex ML teams."
  - role: "Software Engineering Intern — Ads Signal Monitoring"
    org: "Facebook (Meta)"
    period: "Jun 2018 – Sep 2018"
    location: "Menlo Park, CA"
    summary: "Built real-time statistical anomaly detection systems on live Facebook Pixel conversion streams."
    highlights:
      - "Automated high-throughput signal integrity alerting across advertiser conversion pipelines."
  - role: "Early Research & Open Source Engineering"
    org: "San Diego Supercomputer Center · Cornell/Maryland/Max Planck (CMMRS) · IRD Paris · NRC Canada · GSoC"
    period: "2015 – 2018"
    location: "San Diego · Saarbrücken · Paris · Ottawa"
    summary: "Cross-disciplinary research in computer vision, agent-based ecological modeling, and computational social networks."
    highlights:
      - "Selected on full scholarship among Top 30 globally for the Cornell, Maryland, Max Planck Pre-doctoral Research School (CMMRS) at MPI-SWS in Saarbrücken, Germany."
      - "Automated histology brain-atlas image annotation at SDSC; CORMAS spatial agent-based modeling in Pharo Smalltalk at IRD Paris (ESUG Scholar); kinetic Monte Carlo social simulation at NRC Canada (Government of Canada Mitacs Globalink Research Scholar)."
      - "Awarded competitive international research and conference grants by the Government of Canada (Mitacs), Government of Norway, The Linux Foundation, and Facebook (Grace Hopper Scholar); two-time Google Summer of Code developer & Organization Administrator."

