  faqs:
    - q: "What causes runaway token spend in multi-step AI agents?"
      a: "Each autonomous tool call appends full prior history and verbose tool payloads back into the prompt window, creating quadratic input-token growth and unbounded retry loops when an external tool errors."
    - q: "How do lifecycle hooks enforce a strict per-session agent budget?"
      a: "Pre-model and post-tool lifecycle hooks meter cumulative input/output tokens in real time, prune redundant tool outputs, downgrade model tiers when approaching soft thresholds, and trip deterministic circuit breakers before crossing hard cent budgets."

