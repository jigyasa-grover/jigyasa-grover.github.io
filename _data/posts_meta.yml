  featured: true
  home_spotlight: true
  seo_title: "TorchTPU Doctor: PyTorch Cloud TPU Profiler — Jigyasa Grover"
  og_image: "/assets/images/opt/torchtpu-doctor-cover.jpg"
  og_image_alt: "TorchTPU Doctor — 7-rule AST linter and Cloud TPU v6e PyTorch profiler by Jigyasa Grover"
  summary: "Catching silent CPU fallbacks, Hugging Face host syncs, and XLA recompiles in PyTorch on Cloud TPU v6e, cutting LoRA step time 2,537× alongside peft #4099."
  repo_url: "https://github.com/jigyasa-grover/TorchTPU-Doctor"
  live_url: "https://colab.research.google.com/github/jigyasa-grover/TorchTPU-Doctor/blob/main/notebooks/torchtpu_doctor_demo.ipynb"
  skill_url: "https://raw.githubusercontent.com/jigyasa-grover/TorchTPU-Doctor/main/.agents/skills/torchtpu-doctor/SKILL.md"
  md_url: "/TorchTPUDoctor/index.md"
  faqs:
    - q: "Why does a standard CUDA PyTorch LoRA script stall on Google Cloud TPU v6e?"
      a: "Three silent bottlenecks cause 44s to 77s step stalls on torch_tpu: unpatched device helpers like peft's infer_device() falling back to CPU, dynamic batch sequence padding triggering full StableHLO XLA recompilations every step, and scalar .item() or boolean host syncs inside Hugging Face transformers flushing the TPU HBM queue."
    - q: "How much faster is LoRA fine-tuning with TorchTPU Doctor?"
      a: "Applying TorchTPU Doctor's 7-rule AST linter, runtime sync patches, static shape bucketing, and torch.compile(backend='tpu', dynamic=False) cuts Qwen2.5-0.5B-Instruct LoRA step latency on Cloud TPU v6e-1 from 47.3 seconds/step down to 18.6 ms/step (a 2,537× speedup)."

