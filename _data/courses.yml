  - number: "04"
    title: "Executive & University Programs"
    kicker: "90-Min Briefings · Guest Lectures"
    summary: "Grounded production AI frameworks for C-suite offsites, venture portfolio summits, and graduate CS curricula."

capability_domains:
  - number: "01"
    title: "Agentic AI, ADK & MCP"
    summary: "Multi-agent topologies vs. state machines, tool schemas, session memory, and human-in-the-loop safety callbacks."
  - number: "02"
    title: "LLM Evals, Safety & FinOps"
    summary: "Golden datasets, trajectory grading, Pass@k, calibrated LLM-as-a-Judge rubrics, PII redaction, and token circuit breakers."
  - number: "03"
    title: "Search, Ranking & Personalization"
    summary: "Multi-task Mixture-of-Experts (MoE) ranking, CTR/conversion calibration, cold-start smoothing, and sub-50ms serving."
  - number: "04"
    title: "Data-Centric ML & Feature Stores"
    summary: "Dataset curation (Sculpting Data for ML), confident learning, preventing data cascades, and real-time feature hydration."
  - number: "05"
    title: "Fine-Tuning & Cloud TPUs"
    summary: "Supervised fine-tuning (Gemma/open-weights), LoRA profiling, catching XLA recompiles, and GPU/TPU efficiency."
  - number: "06"
    title: "Developer AI Workflows & Strategy"
    summary: "Productive coding-agent adoption, custom skills & AST linters, build-vs-buy ROI, and production AI governance."

