workshops:
  - title: "When (and How) to Build Production AI Agents"
    duration: "Half-Day (3.5h) or Full-Day (6h) Hands-On Lab"
    audience: "Backend, Platform & Applied AI Engineers"
    abstract: "Decision frameworks separating deterministic workflows from autonomous multi-agent topologies, followed by hands-on implementation using Google ADK, MCP tool servers, session state, and cost/token circuit breakers."
  - title: "Evaluating, Red-Teaming & Guardrailing LLM Systems"
    duration: "Half-Day (3.5h) Technical Workshop"
    audience: "ML Engineers, Tech Leads & Quality/Platform Teams"
    abstract: "Build automated evaluation harnesses from scratch: trajectory grading, Pass@k reliability metrics, Vertex AI / open-source LLM comparators, PII redaction, and prompt-injection defenses."
  - title: "AI Architecture & Strategy for Engineering Leaders"
    duration: "90-Minute Executive Briefing + Interactive Q&A"
    audience: "CTOs, VPs of Engineering, Product Directors & Founders"
    abstract: "Cut through vendor hype to evaluate build-vs-buy decisions, unit economics of inference, RAG vs. fine-tuning ROI, latency SLAs, and organizational readiness for agentic workflows."
