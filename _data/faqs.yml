about:
  - q: "Who is Jigyasa Grover?"
    a: "Jigyasa Grover is a San Francisco Bay Area Machine Learning Engineer at Uber (Tech Lead for Product Selector Ranking and Engineering Lead for an Org-Wide AI Initiative), technical AI/ML and DevTools creator across LinkedIn, YouTube (@JigyasaGrover), X, and Instagram, 14× AI and Open Source award winner, Google Developer Advisory Board member, LinkedIn Learning instructor (44,000+ learners), and co-author of Sculpting Data for ML."
  - q: "What is her engineering background?"
    a: "Before Uber, she led AI & Research at Bordo AI, built a 0→1 feature store and ads bidding engine at Faire, owned sub-50ms billion-request ads ranking at Twitter/X, and worked at Meta, alongside completing her M.S. in CS (AI) at UC San Diego and attending the Cornell, Maryland, Max Planck Pre-doctoral Research School (CMMRS)."
  - q: "How can founders, organizers, or brands work with her?"
    a: "Submit an inquiry on Work With Me, book a 1:1 consultation via Intro, or scope developer brand campaigns via Passionfroot, Naano, or 8x."

advisory:
  - q: "What topics does Jigyasa advise startups and engineering leaders on?"
    a: "Production ML ranking and personalization, feature stores, multi-agent orchestration vs. deterministic workflows, LLM evaluation harnesses, inference cost guardrails, and AI go-to-market (GTM) & developer positioning."
  - q: "Does Jigyasa advise AI startups on Go-To-Market (GTM) strategy and developer marketing?"
    a: "Yes. Through Afterdays (advising and consulting 30+ teams across Anthropic, Google gDAB, Windsurf, Base44, Okareo, and venture funds), she helps AI founders pressure-test technical positioning, SDK onboarding friction, benchmark-led marketing, and enterprise vs. PLG developer GTM."
  - q: "How are advisory engagements structured?"
    a: "Book focused 1:1 architecture or GTM strategy calls via Intro (5.0★), or inquire via Work With Me for ongoing startup advisory retainers through her independent practice, Afterdays."

speaking:
  - q: "What are Jigyasa's signature keynote and conference topics?"
    a: "Agentic AI architecture ('When NOT to Build an Agent'), Agent-Native APIs & Cost Guardrails, Quantitative LLM Evaluation & AI Security, Split-Brain Edge + Cloud Real-Time AI, and Data-Centric ML."
  - q: "Where is she based for event travel, and how are travel and accommodation handled?"
    a: "She is based in the San Francisco Bay Area (SFO / SJC) and travels globally for keynotes, executive panels, and official conference Creator-in-Residence programs with travel and hotel hospitality covered by the event organizer or an exhibiting ecosystem sponsor."

teaching:
  - q: "What organizations has Jigyasa delivered corporate AI training with?"
    a: "She has trained 44,000+ learners on LinkedIn Learning and delivered corporate AI training and workshops with LinkedIn Learning, Morgan Stanley, FedEx, Accenture, Roblox, Silicon Valley Security Group, AI Aspire, CommonSpirit Health, Interview Kickstart, and Udacity."
  - q: "Can workshops be tailored to our internal stack and L&D budget?"
    a: "Yes. Sessions run as 90-minute executive briefings, half-day intensives, or full-day labs across Agentic AI/MCP, LLM evals, ranking, data-centric ML, Cloud TPUs, and developer AI workflows, with runnable repos and L&D-eligible certificates."

partnerships:
  - q: "How does Jigyasa support AI go-to-market (GTM) and developer marketing launches?"
    a: "She partners with AI labs, hyperscalers, and B2B DevTools teams on code-backed go-to-market (GTM) launches, pairing forkable GitHub reference implementations and GEO/SEO technical essays with LinkedIn, X, 9:16 creator video, and live webinars across 28+ past brand partners including Google, DeepMind, Google Cloud, Meta, Adobe, Fireflies.ai, Qodo, and Parallel."
  - q: "What developer partnerships and launch bundles does Jigyasa take on?"
    a: "Single-channel or Full-Stack Technical Launch Bundles combining runnable GitHub reference repos, permanent technical blog essays, LinkedIn/X launch sequences, 9:16 creator Reels/Shorts, and live developer webinars."
  - q: "Who makes up her audience and target buyer ICP?"
    a: "Across LinkedIn (~318K annual impressions, 167K+ unique members reached, 14.7K+ followers), GitHub (76+ repos), YouTube (@JigyasaGrover), X, Instagram Reels, and her RSS-syndicated technical blog, 80%+ of her audience are senior technical practitioners and buyers (including 9% CXO, 9% Founder, and 5% Co-Founder; 22% SF Bay Area, 8% NYC, 4% London; top follower companies: Google, LinkedIn, Google DeepMind, Meta, Microsoft, Amazon, AWS, NVIDIA, OpenAI, and Apple)."
  - q: "What standalone channels does Jigyasa Grover publish on as a B2B AI, YouTube, and technical creator?"
    a: "She publishes directly across her standalone @JigyasaGrover YouTube channel (70+ AI Shorts, 64+ playlists, 300K+ aggregate video and talk views), LinkedIn (14,700+ followers, ~318K annual impressions, 167K+ reached, 2.5%+ recent 90-day engagement rate), X (@jigyasa_grover, 2,500+ practitioners), Instagram Reels and TikTok (@jigyasagroverofficial), DEV Community (@jigyasagrover), GitHub (76+ public repos, 245+ upstream PRs & issues), and her RSS-syndicated AI Engineering Blog (/blog/, 34+ indexed essays at /feed.xml), booking sponsorships via Passionfroot, Naano, 8x, and LinkedIn Creator Marketplace (including Thought Leader Ads)."
  - q: "What should GTM and marketing teams include when inquiring about a sponsorship?"
    a: "Share your product URL, target developer or enterprise AI buyer persona, preferred channel or Full-Stack Launch Bundle, target launch window, and sandbox access, or book standard packages directly via Passionfroot, Naano, 8x, or LinkedIn Creator Marketplace."

work_with_me:
  - q: "What collaboration tracks does Jigyasa Grover offer?"
    a: "Six tracks: AI Startup & GTM Advisory (via Afterdays & Intro), Global Keynotes & Executive Panels, Corporate AI Training & Workshops, AI Go-To-Market & Developer Marketing Partnerships (via Passionfroot, Naano & 8x), Books & Curriculum Authoring, and Press & Broadcast Commentary."
  - q: "What is the fastest way to book a 1:1 consultation or developer launch campaign?"
    a: "Book instant 1:1 video consultations on Intro (5.0★ verified reviews), scope sponsored developer or AI launch campaigns directly via Passionfroot, Naano, or 8x, or submit custom scopes through the direct inquiry form (typical response within 48 hours)."

projects:
  - q: "What open-source AI, Hugging Face, and Cloud TPU contributions has Jigyasa Grover authored?"
    a: "Across 245+ upstream pull requests and issues in 32 external repositories plus 76+ public GitHub repos, highlights include a merged PyTorch/Cloud TPU fix in Hugging Face peft (#4099 / #4101, adding torch.accelerator TPU device routing), eager-mode TPU sync profiling across transformers (#50267) and torch_tpu (#6127), authoring Learn Smalltalk in Y Minutes (12.4K+ ★), TorchTPU Doctor (2,537× LoRA speedup on Cloud TPU v6e), Startup on a Shoestring, Trust at Top Speed, and Critic's Cut."
  - q: "Are the repositories, Agent Skills, and Colab notebooks free to fork and run?"
    a: "Yes. Open-source reference implementations, Agent Skills, Google Colab notebooks, and official LinkedIn Learning course companion labs are publicly available at github.com/jigyasa-grover."

press:
  - q: "Where has Jigyasa Grover been featured in global press and broadcasts?"
    a: "She has been featured on the Google I/O main keynote stage (introduced by Sundar Pichai), Google's official Gemini Omni Flash launch video, Google Cloud Tech documentaries & livestreams, Remitly (NASDAQ: RELY) Wall Street earnings presentations, Forbes, Business Insider, Communications of the ACM, Codemotion Magazine, Routledge, The Forage, LeadDev, VentureBeat, Observer, Hyperight, MIT Sloan × BCG, Grazia UK, UN ITU, and NTD Live TV."
  - q: "How should event organizers and journalists pronounce and credit Jigyasa Grover?"
    a: "Jigyasa Grover is pronounced jig-YAH-sah GROH-ver (/dʒɪɡˈjɑːsɑː ˈɡroʊvər/). Credit her as Machine Learning Engineer (Tech Lead, Product Selector Ranking) at Uber, Google Developer Advisory Board (gDAB) member, 14× AI & Open Source Award Winner, and co-author of Sculpting Data for ML, using the approved 50-word or 150-word bios and portraits on this page."

publications:
  - q: "What books and peer-reviewed papers has Jigyasa Grover authored?"
    a: "She co-authored Sculpting Data for ML: The First Act of Machine Learning (ISBN 979-8585463570 & 978-0-578-83125-1, assigned on Cornell Tech's CS 5781 syllabus, 100+ academic citations across NeurIPS, ICLR, EMNLP, NAACL & ACM CHI, 4.8★ on Goodreads), Enterprise LLM Deployment Readiness (SSRN 2026 via the AI Assurance Council), two Springer chapters (cited by Stanford's Cyber Policy Center), an ACM IWST research paper, and open-source Smalltalk/Pharo guides."
  - q: "Does Jigyasa review technical manuscripts or collaborate with publishers?"
    a: "Yes. She serves as a technical book reviewer for O'Reilly Media (Scalable AI Systems, Machine Learning with Python Cookbook 2nd Ed.) and Packt Publishing (Principles of Data Science 3rd Ed., Exploring Deepfakes), provided the lead endorsement for Routledge / Taylor & Francis's AI for Community (2025/2026) and Practical Python Projects, and welcomes curriculum, monograph, and benchmark collaborations via Work With Me."

media_kit:
  - q: "Does Jigyasa accept tech hardware, AI gadgets, and electronics for review or PR seeding?"
    a: "Yes. She reviews and features select AI laptops, developer workstations, smart glasses, AI wearables, edge inference kits, and creator studio/travel electronics that fit authentic ML engineering and global travel workflows. PR teams can request SF Bay Area shipping details and embargo coordination via Work With Me."
  - q: "Is she available for VIP creator events in San Francisco and sponsored global summits?"
    a: "Yes. Based in the San Francisco Bay Area (SFO / SJC), she attends local embargoed hardware demos, founder/creator dinners, and launch showcases, and travels internationally for hosted creator summits and flagship launches."
  - q: "How do conference Creator-in-Residence or sponsor-backed travel packages work?"
    a: "Conferences and exhibiting cloud, AI, or hardware sponsors can book a combined Stage + Creator Coverage package (keynote or panel, on-site executive interviews, 9:16 vertical event Reels, and LinkedIn recaps) with flights and hotel hospitality covered."
  - q: "Are Jigyasa's creator collaborations and hardware reviews independent of her employer and community honors?"
    a: "Yes. All creator content, event coverage, and hardware or software reviews are produced independently in her personal capacity across her owned media channels (@JigyasaGrover), reflecting her own practitioner views. Google Developer Expert (GDE) and Google Developer Advisory Board (gDAB) roles are unpaid external community appointments, not Google employment."
