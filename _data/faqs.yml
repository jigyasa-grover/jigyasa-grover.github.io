about:
  - q: "Who is Jigyasa Grover?"
    a: "Jigyasa Grover is a San Francisco–based Machine Learning Engineer at Uber (Tech Lead for Rider Personalization & Ranking), 13× AI and Open Source award winner, Google Developer Advisory Board member, LinkedIn Learning instructor, and co-author of Sculpting Data for ML."
  - q: "What is her engineering background?"
    a: "Before Uber, she led AI & Research at Bordo AI, built a 0→1 feature store and ads bidding engine at Faire, owned sub-50ms billion-request ads ranking at Twitter/X, and worked at Meta, alongside completing her M.S. in CS (AI) at UC San Diego and attending the Cornell, Maryland, Max Planck Pre-doctoral Research School (CMMRS)."
  - q: "How can founders, organizers, or brands work with her?"
    a: "Submit an inquiry on Work With Me, book a 1:1 consultation via Intro, or scope developer brand campaigns via Passionfroot, Naano, or 8x."

advisory:
  - q: "What topics does Jigyasa advise startups and engineering leaders on?"
    a: "Production ML ranking and personalization, feature stores, multi-agent orchestration vs. deterministic workflows, LLM evaluation harnesses, inference cost guardrails, and AI go-to-market (GTM) & developer positioning."
  - q: "Does Jigyasa advise AI startups on Go-To-Market (GTM) strategy and developer marketing?"
    a: "Yes. Through Afterdays—having advised and consulted 30+ teams across Anthropic, Google (gDAB), Windsurf, Base44, Okareo, and venture funds—she helps AI founders pressure-test technical positioning, SDK onboarding friction, benchmark-led marketing, and enterprise vs. PLG developer GTM."
  - q: "How are advisory engagements structured?"
    a: "Book focused 1:1 architecture or GTM strategy calls via Intro (5.0★), or inquire via Work With Me for ongoing startup advisory retainers through her independent practice, Afterdays."

speaking:
  - q: "What are Jigyasa's signature keynote and conference topics?"
    a: "Agentic AI architecture ('When NOT to Build an Agent'), Agent-Native APIs & Cost Guardrails, Quantitative LLM Evaluation & AI Security, Split-Brain Edge + Cloud Real-Time AI, and Data-Centric ML."
  - q: "Where is she based for event travel?"
    a: "San Francisco Bay Area (SFO / SJC), available for in-person international keynotes, executive summits, and virtual events."

teaching:
  - q: "What organizations has Jigyasa delivered corporate AI training with?"
    a: "She has trained 44,000+ learners on LinkedIn Learning and delivered corporate AI training and workshops with LinkedIn Learning, Morgan Stanley, FedEx, Accenture, Roblox, Silicon Valley Security Group, AI Aspire, CommonSpirit Health, and Udacity."
  - q: "Can workshops be tailored to our internal stack and L&D budget?"
    a: "Yes—sessions run as 90-minute executive briefings, half-day intensives, or full-day labs across Agentic AI/MCP, LLM evals, ranking, data-centric ML, Cloud TPUs, and developer AI workflows, with runnable repos and L&D-eligible certificates."

partnerships:
  - q: "How does Jigyasa support AI go-to-market (GTM) and developer marketing launches?"
    a: "She partners with AI labs, hyperscalers, and B2B DevTools teams on code-backed go-to-market (GTM) launches—pairing forkable GitHub reference implementations and GEO/SEO technical essays with LinkedIn, X, 9:16 creator video, and live webinars across 24+ past brand partners including Google, DeepMind, Google Cloud, Meta, Adobe, Fireflies.ai, Qodo, and Parallel."
  - q: "What developer partnerships and launch bundles does Jigyasa take on?"
    a: "Single-channel or Full-Stack Technical Launch Bundles combining runnable GitHub reference repos, permanent technical blog essays, LinkedIn/X launch sequences, 9:16 creator Reels/Shorts, and live developer webinars."
  - q: "Who makes up her audience and target buyer ICP?"
    a: "Across LinkedIn (325K+ annual impressions, 14.5K+ followers), GitHub (74+ repos), X, creator video, and her technical blog, 82% of her audience are senior technical practitioners and buyers—Staff+ Engineers, Engineering Directors, VPs, Founders, and C-Suite leaders."
  - q: "What should GTM and marketing teams include when inquiring about a sponsorship?"
    a: "Share your product URL, target developer or enterprise AI buyer persona, preferred channel or Full-Stack Launch Bundle, target launch window, and sandbox access—or book standard packages directly via Passionfroot, Naano, or 8x."
