about:
  - q: "Who is Jigyasa Grover?"
    a: "Jigyasa Grover is a San Francisco–based Machine Learning Engineer at Uber (Tech Lead for Rider Personalization & Ranking), 13× AI and Open Source award winner, Google Developer Advisory Board member, LinkedIn Learning instructor, and co-author of Sculpting Data for ML."
  - q: "What is her engineering background?"
    a: "Before Uber, she led AI & Research at Bordo AI, built a 0→1 feature store and ads bidding engine at Faire, owned sub-50ms billion-request ads ranking at Twitter/X, and worked at Meta, alongside completing her M.S. in CS (AI) at UC San Diego and attending the Cornell, Maryland, Max Planck Pre-doctoral Research School (CMMRS)."
  - q: "How can founders, organizers, or brands work with her?"
    a: "Submit an inquiry on Work With Me, book a 1:1 consultation via Intro or Topmate, or scope developer brand campaigns via Passionfroot or Naano."

advisory:
  - q: "What topics does Jigyasa advise startups and engineering leaders on?"
    a: "Production ML ranking and personalization, feature stores, multi-agent orchestration vs. deterministic workflows, LLM evaluation harnesses, inference cost guardrails, and developer GTM."
  - q: "How are advisory engagements structured?"
    a: "Book focused 1:1 architecture or strategy calls via Intro or Topmate, or inquire via Work With Me for ongoing startup advisory retainers through her independent practice, Afterdays."

speaking:
  - q: "What are Jigyasa's signature keynote and conference topics?"
    a: "Agentic AI architecture ('When NOT to Build an Agent'), Agent-Native APIs & Cost Guardrails, Quantitative LLM Evaluation & AI Security, Split-Brain Edge + Cloud Real-Time AI, and Data-Centric ML."
  - q: "Where is she based for event travel?"
    a: "San Francisco Bay Area (SFO / SJC), available for in-person international keynotes, executive summits, and virtual events."

teaching:
  - q: "What organizations has Jigyasa delivered corporate AI training with?"
    a: "She has trained 44,000+ learners on LinkedIn Learning and delivered corporate AI training and workshops with LinkedIn Learning, Morgan Stanley, FedEx, Accenture, Roblox, Silicon Valley Security Group, AI Aspire, CommonSpirit Health, and Udacity."
  - q: "Can workshops be tailored to our internal stack?"
    a: "Yes—sessions run as 90-minute executive briefings, half-day intensives, or full-day labs customized to Python, Google ADK / Vertex AI, or multi-provider LLM stacks."

partnerships:
  - q: "What developer partnerships does Jigyasa take on?"
    a: "Code-backed technical deep dives, open-source reference apps, SDK teardowns, and LinkedIn/X launch analyses for AI platforms, cloud providers, and DevTools."
  - q: "Who makes up her audience?"
    a: "Across LinkedIn (325K+ annual impressions), GitHub, X, and her blog, 82% of readers are senior practitioners and decision-makers—Staff+ Engineers, Directors, VPs, and Founders."
