name: Jigyasa Grover
title: Jigyasa Grover — Machine Learning Engineer, Agentic AI Educator, Author & Advisor
tagline: Production AI Systems · Agentic Engineering · Technical Education · Industry Advisory
description: "Jigyasa Grover is a Machine Learning Engineer at Uber, 13x AI & Open Source Award Winner, Google Developer Advisory Board member, LinkedIn Learning instructor (44K+ learners), and co-author of Sculpting Data for ML."
author: Jigyasa Grover
locale: en_US

url: https://jigyasa-grover.github.io
baseurl: ""
avatar: /assets/images/opt/profile_photo.jpg
og_image: /assets/images/opt/google_io_feature.jpg

# Analytics (GA4 active; legacy Universal Analytics removed)
google_analytics_ga4: G-GC9TNKJ6GT

# Contact Form Configuration
# Set formspree_endpoint to your Formspree URL (e.g., "https://formspree.io/f/xxxxxxxx")
# or web3forms_access_key to a public Web3Forms access key for direct inbox delivery.
# Leave blank to use the built-in validated mailto composer fallback without exposing secrets.
contact:
  formspree_endpoint: ""
  web3forms_access_key: ""
  fallback_email: "grover.jigyasa2@gmail.com"

# Live Instagram Feed Hydration (Optional)
# Paste a free Behold.so JSON feed URL (e.g., "https://feeds.behold.so/xxxxxxxx")
# to auto-hydrate your latest Instagram Reels & posts into the Social Pulse cards.
social:
  behold_feed_url: ""

footer-links:
  github: jigyasa-grover
  linkedin: jigyasa-grover
  twitter: jigyasa_grover
  youtube: "@JigyasaGrover"
  instagram: jigyasagroverofficial
  wordpress: jigyasagrover

permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

sass:
  sass_dir: _sass
  style: :compressed

repository: jigyasa-grover/jigyasa-grover.github.io

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

include:
  - _pages
  - .well-known

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Jigyasa Grover"

exclude:
  - .editorconfig
  - .github
  - AGENTS.md
  - CLAUDE.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - Makefile
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - vendor
